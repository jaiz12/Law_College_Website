<app-site-header></app-site-header>

<app-page-banner [title]="pageTitle"></app-page-banner>

<main class="page-shell">
  <div class="page-shell-inner">

    @if (loading) {
      <p class="site-empty">Loading&hellip;</p>
    } @else if (items.length) {
      <ul class="site-list">
        @for (item of items; track item.id) {
          <li>
            <button type="button" class="site-list-row"
                    [class.is-link]="isValidLink(item.externalLink)"
                    (click)="onRowClick(item)">
              <span class="site-list-title">{{ item.title }}</span>
              @if (isValidLink(item.externalLink)) {
                <span class="site-list-arrow" aria-hidden="true">&#8594;</span>
              }
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="site-empty">Nothing here yet — check back soon.</p>
    }

  </div>
</main>

<app-site-footer></app-site-footer>
